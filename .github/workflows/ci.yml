name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests evaluation
      - name: Ruff format
        run: ruff format --check src tests evaluation
      - name: Mypy (strict)
        run: mypy src evaluation

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Pytest
        run: pytest --cov=apkguard --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t apkguard:ci .
      - name: Smoke test image
        run: |
          docker run --rm apkguard:ci --version
          docker run --rm -v "$PWD/tests/fixtures/apks:/work:ro" apkguard:ci \
            scan org.billthefarmer.tuner_158.apk --fail-on none

  action:
    # Exercise the composite action from this repository against a fixture APK.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run APKGuard action
        id: apkguard
        uses: ./
        with:
          apk: tests/fixtures/apks/org.billthefarmer.editor_198.apk
          fail-on: critical
          html-file: apkguard-report.html
          upload-sarif: "false"
      - name: Check outputs
        run: |
          test "${{ steps.apkguard.outputs.exit-code }}" = "0"
          test -s apkguard.sarif
          test -s apkguard-report.html
      - name: Create a baseline (apkguard is on PATH after the action ran)
        run: >
          apkguard scan tests/fixtures/apks/org.billthefarmer.notes_141.apk -q
          --write-baseline apkguard-baseline.json
      - name: Run APKGuard action against the baseline
        id: with-baseline
        uses: ./
        with:
          # Notes has a HIGH cleartext finding, so this would fail without the baseline.
          apk: tests/fixtures/apks/org.billthefarmer.notes_141.apk
          fail-on: low
          baseline: apkguard-baseline.json
          sarif-file: apkguard-baseline-run.sarif
          upload-sarif: "false"
      - name: Check the baseline run passed
        run: test "${{ steps.with-baseline.outputs.exit-code }}" = "0"
      - uses: actions/upload-artifact@v4
        with:
          name: apkguard-reports
          path: |
            apkguard.sarif
            apkguard-report.html
