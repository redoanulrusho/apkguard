name: "APKGuard - Android APK security scan"
description: "Static security scan of an Android APK, with SARIF upload to GitHub code scanning."
author: "APKGuard contributors"
branding:
  icon: "shield"
  color: "green"

inputs:
  apk:
    description: "Path to the APK file to scan."
    required: true
  fail-on:
    description: "Fail the step if a finding has at least this severity (info, low, medium, high, critical, none)."
    required: false
    default: "high"
  config:
    description: "Path to an .apkguard.yml configuration file. Defaults to ./.apkguard.yml if it exists."
    required: false
    default: ""
  baseline:
    description: "Optional baseline file (created with `apkguard scan app.apk --write-baseline FILE`). Only findings that are not in it fail the step."
    required: false
    default: ""
  library-findings:
    description: "Findings in third-party libraries: separate (reported, never fail the step), include, or exclude. Defaults to the config file value, or separate."
    required: false
    default: ""
  sarif-file:
    description: "Where to write the SARIF report."
    required: false
    default: "apkguard.sarif"
  html-file:
    description: "Optional path for a standalone HTML report (upload it with actions/upload-artifact)."
    required: false
    default: ""
  json-file:
    description: "Optional path for a JSON report."
    required: false
    default: ""
  upload-sarif:
    description: "Upload the SARIF report to GitHub code scanning (needs `security-events: write`)."
    required: false
    default: "true"
  python-version:
    description: "Python version used to run APKGuard."
    required: false
    default: "3.12"

outputs:
  exit-code:
    description: "APKGuard exit code: 0 = pass, 1 = findings at/above fail-on, 2 = usage error, 3 = scan error."
    value: ${{ steps.scan.outputs.exit-code }}
  sarif-file:
    description: "Path of the generated SARIF report."
    value: ${{ inputs.sarif-file }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install APKGuard
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check --quiet "$ACTION_PATH"

    - name: Scan APK
      id: scan
      shell: bash
      # Inputs are passed through environment variables to avoid shell injection.
      env:
        APK: ${{ inputs.apk }}
        FAIL_ON: ${{ inputs.fail-on }}
        CONFIG: ${{ inputs.config }}
        BASELINE: ${{ inputs.baseline }}
        LIBRARY_FINDINGS: ${{ inputs.library-findings }}
        SARIF: ${{ inputs.sarif-file }}
        HTML: ${{ inputs.html-file }}
        JSON: ${{ inputs.json-file }}
      run: |
        args=(scan "$APK" --fail-on "$FAIL_ON" --sarif "$SARIF")
        [ -n "$CONFIG" ] && args+=(--config "$CONFIG")
        [ -n "$BASELINE" ] && args+=(--baseline "$BASELINE")
        [ -n "$LIBRARY_FINDINGS" ] && args+=(--library-findings "$LIBRARY_FINDINGS")
        [ -n "$HTML" ] && args+=(--html "$HTML")
        [ -n "$JSON" ] && args+=(--json "$JSON")
        set +e
        apkguard "${args[@]}"
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        # 1 means "findings above threshold": defer failing until the SARIF is uploaded.
        if [ "$code" -ge 2 ]; then exit "$code"; fi

    - name: Upload SARIF to code scanning
      if: ${{ always() && inputs.upload-sarif == 'true' && steps.scan.outputs.exit-code != '' && steps.scan.outputs.exit-code < 2 }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: apkguard

    - name: Enforce severity threshold
      if: ${{ steps.scan.outputs.exit-code == '1' }}
      shell: bash
      env:
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        echo "::error title=APKGuard::New findings at or above severity '$FAIL_ON' were detected."
        exit 1
