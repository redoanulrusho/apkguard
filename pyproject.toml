[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "apkguard"
dynamic = ["version"]  # from apkguard.__version__, so the CLI and package can't disagree
description = "Static security scanner for Android APKs, built for CI/CD pipelines (SARIF, baselines, GitHub Action, MCP server)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Redoanul Karim Rusho", email = "redoanulkarim1@gmail.com" }]
maintainers = [{ name = "Redoanul Karim Rusho", email = "redoanulkarim1@gmail.com" }]
keywords = ["android", "apk", "security", "sast", "static-analysis", "sarif", "ci", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "androguard>=4.1,<5",
    "lxml>=4.9",  # imported directly (manifest/XML handling), not only via androguard
    "rich>=13",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/redoanulrusho/apkguard"
Repository = "https://github.com/redoanulrusho/apkguard"
Issues = "https://github.com/redoanulrusho/apkguard/issues"
Changelog = "https://github.com/redoanulrusho/apkguard/blob/main/CHANGELOG.md"
Documentation = "https://github.com/redoanulrusho/apkguard#readme"

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "jsonschema>=4",
    "mcp>=2.3,<3",
    "build>=1",
    "twine>=5",
]

[project.scripts]
apkguard = "apkguard.cli:main"
apkguard-mcp = "apkguard.cli:mcp_main"

[tool.setuptools.dynamic]
version = { attr = "apkguard.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
apkguard = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["integration: tests that parse real APK fixtures"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.ruff.lint.isort]
known-first-party = ["apkguard"]
known-local-folder = ["helpers", "run_evaluation"]

[tool.ruff.lint.per-file-ignores]
# Smali signatures and inline XML in tests are long by nature.
"tests/**" = ["E501"]
