[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apkguard"
version = "0.1.0"
description = "Static security scanner for Android APKs, built for CI/CD pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "APKGuard contributors" }]
keywords = ["android", "apk", "security", "sast", "sarif", "ci"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Environment :: Console",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "androguard>=4.1,<5",
    "rich>=13",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "types-PyYAML", "jsonschema>=4"]

[project.scripts]
apkguard = "apkguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
apkguard = ["py.typed", "reporters/*.html"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["integration: tests that parse real APK fixtures"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.ruff.lint.isort]
known-first-party = ["apkguard"]
known-local-folder = ["helpers"]

[tool.ruff.lint.per-file-ignores]
# Smali signatures and inline XML in tests are long by nature.
"tests/**" = ["E501"]
