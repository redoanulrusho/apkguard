# Example: build a release APK and scan it with APKGuard on every pull request.
# Copy to .github/workflows/apkguard.yml in your Android project.
name: APK security scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write   # required to upload SARIF to code scanning

jobs:
  apkguard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build release APK
        run: ./gradlew assembleRelease
      - name: Scan with APKGuard
        uses: apkguard/apkguard@v0.1.0   # replace with the published location of this action
        with:
          apk: app/build/outputs/apk/release/app-release-unsigned.apk
          fail-on: high
          # Optional: only fail on findings that are not in the committed baseline.
          # Create it once with: apkguard scan app-release.apk --write-baseline apkguard-baseline.json
          baseline: apkguard-baseline.json
          html-file: apkguard-report.html
      - name: Keep the HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apkguard-report
          path: apkguard-report.html
